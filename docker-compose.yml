# Entorno de desarrollo: web, db, redis, worker y beat.
x-app: &app
  build:
    context: .
    target: base
    args:
      UV_GROUPS: ""
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://crecenta:crecenta@db:5432/crecenta
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crecenta
      POSTGRES_USER: crecenta
      POSTGRES_PASSWORD: crecenta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crecenta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
