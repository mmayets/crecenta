<div class="space-y-2 text-sm">
  <p class="ml-auto w-fit max-w-[90%] rounded-2xl rounded-br-sm bg-marca-700 px-3 py-2 text-white">{{ reply.pregunta }}</p>
  <div class="max-w-[95%]">
    <p class="rounded-2xl rounded-tl-sm bg-slate-100 px-3 py-2">{{ reply.mensaje }}</p>
    {% if reply.enlaces %}
      <div class="mt-2 flex flex-wrap gap-2">
        {% for link in reply.enlaces %}<a class="btn-secondary btn-sm" href="{{ link.url }}">{{ link.texto }}</a>{% endfor %}
      </div>
    {% endif %}
  </div>
</div>
